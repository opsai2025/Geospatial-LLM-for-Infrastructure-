# Theme for the Persian (RTL) user interface.
# The B Nazanin font is served from ./static/fonts so every browser renders it,
# even on computers that do not have the font installed.

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#15803d"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f7"
textColor = "#0f172a"
linkColor = "#0054A3"
borderColor = "#d5dde8"
font = "BNazanin, 'B Nazanin', Vazirmatn, Tahoma, sans-serif"
headingFont = "BNazanin, 'B Nazanin', Vazirmatn, Tahoma, sans-serif"
baseFontSize = 18
baseRadius = "0.6rem"
dataframeHeaderBackgroundColor = "#e2e8f0"

[[theme.fontFaces]]
family = "BNazanin"
url = "app/static/fonts/BNazanin.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "BNazanin"
url = "app/static/fonts/BNazanin-Bold.ttf"
weight = "700"
style = "normal"

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"
