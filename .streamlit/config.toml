# Shared Streamlit theme. The Persian interface applies B Nazanin in its own
# CSS; the English interface uses a Latin-friendly sans-serif font.

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#15803d"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f7"
textColor = "#0f172a"
linkColor = "#0054A3"
borderColor = "#d5dde8"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 18
baseRadius = "0.6rem"
dataframeHeaderBackgroundColor = "#e2e8f0"

[[theme.fontFaces]]
family = "BNazanin"
url = "app/static/fonts/BNazanin.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "BNazanin"
url = "app/static/fonts/BNazanin-Bold.ttf"
weight = "700"
style = "normal"

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"
